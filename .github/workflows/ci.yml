name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # XAMPP ships PHP 8.x (see README), so lint against 8.2.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      # No build or typecheck step exists for plain PHP, so the syntax check
      # is the equivalent gate. lib/ is vendored PHPMailer and not ours to
      # lint. Every file is checked before failing so one run lists all
      # broken files, not just the first.
      - name: Lint PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './lib/*' -not -path './.git/*' -print0)
          exit $status

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema-check:
    name: Validate schema
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres, the engine Supabase runs. The container lives
      # only for this job, so the check is safe on any PR and needs no
      # shared credentials. The official image ships the contrib modules,
      # so schema.sql can create the citext extension.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plp_admissions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plp_admissions"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # schema.sql drops and recreates every table, which is why it is only
      # ever applied here, against the disposable service container.
      # ON_ERROR_STOP makes psql exit non-zero on the first SQL error.
      - name: Apply schema
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d plp_admissions -v ON_ERROR_STOP=1 -f database/schema.sql

      # The file claims to be idempotent. Running it a second time over the
      # tables the first run created proves that claim on every change.
      - name: Re-apply schema (idempotency)
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d plp_admissions -v ON_ERROR_STOP=1 -f database/schema.sql

  smoke-test:
    name: App smoke test
    runs-on: ubuntu-latest
    services:
      # Same throwaway Postgres as schema-check. CI never touches the shared
      # Supabase project used for local development and Vercel, and needs
      # none of its credentials. Everything below points at this container.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plp_admissions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plp_admissions"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: plp_admissions
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, pgsql, mbstring, curl
          coverage: none

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d plp_admissions -v ON_ERROR_STOP=1 -f database/schema.sql

      # Same command developers use locally (php -S from the project root).
      # php -l cannot catch an empty class file or a missing include; booting
      # the app and requesting real pages can.
      - name: Start app
        run: |
          php -S 127.0.0.1:8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8000/public/login; then exit 0; fi
            sleep 1
          done
          echo "Server did not start"
          cat server.log
          exit 1

      # Logged-out requests. Pages may answer 200 or redirect to login; what
      # fails the job is a 5xx or a PHP fatal in the body (APP_ENV=development
      # prints errors into the page).
      - name: Request pages
        run: |
          fail=0
          check() {
            code=$(curl -s -o body.txt -w '%{http_code}' "http://127.0.0.1:8000$1")
            if [ "$code" -ge 500 ] || grep -qE 'Fatal error|Parse error|Uncaught' body.txt; then
              echo "FAIL $1 (HTTP $code)"
              head -c 1500 body.txt
              echo
              fail=1
            else
              echo "ok   $1 (HTTP $code)"
            fi
          }
          check /public/
          check /public/login
          check /public/register
          check /public/forgot-password
          check /public/student/documents
          check /public/staff/dashboard
          check /public/admin/dashboard
          if [ "$fail" -ne 0 ]; then
            echo "--- server log"
            cat server.log
          fi
          exit "$fail"
