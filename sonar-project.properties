sonar.projectKey=JjByteX_plp-admissions
sonar.organization=jjbytex
sonar.projectName=PLP Admissions

# Source roots. No test directory exists yet (no test framework in the
# repo), so sonar.tests is left unset rather than pointed at a folder that
# doesn't exist. lib/ (vendored PHPMailer) and database/ are deliberately
# not listed, so they are never scanned.
sonar.sources=api,config,core,modules,views,public

# Keep generated and non-code files out of the scan. chart.umd.js is a
# minified Chart.js bundle, jquery.min.js is the vendored jQuery 3.x, public/uploads holds runtime user content, and
# the SVGs are icons, none of which is hand-authored app code.
sonar.exclusions=public/uploads/**,public/assets/js/chart.umd.js,public/assets/js/jquery.min.js,**/*.svg

# PHP analysis
sonar.sourceEncoding=UTF-8
sonar.php.file.suffixes=php
